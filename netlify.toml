[build]
  # Build command
  command = "npm run build"
  # Directory to deploy
  publish = "dist"

# Main domain: Redirect /admin to admin subdomain
[[redirects]]
  from = "/admin/*"
  to = "https://admin.propellacam.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["propellacam.com", "www.propellacam.com", "propella.cm"]}

[[redirects]]
  from = "/admin"
  to = "https://admin.propellacam.com/"
  status = 301
  force = true
  conditions = {Host = ["propellacam.com", "www.propellacam.com", "propella.cm"]}

# SPA fallback for ALL domains (including admin subdomain)
# Note: Static files (like sitemap.xml, robots.txt) are served automatically by Netlify
# and won't be caught by this catch-all rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
